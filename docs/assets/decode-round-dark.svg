<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="每轮解码耗时随上下文长度的变化：优化前在 91K 上下文时为 292 毫秒，优化后在 86K 时为 63 毫秒">
